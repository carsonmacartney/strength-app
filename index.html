<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strength Log</title>
<meta name="theme-color" content="#000000" />
<meta name="description" content="Split-based strength training tracker with week progression, volume, and adherence." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Strength Log" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="app-title">Strength Log</div>
  </header>

  <nav id="tabbar" class="tabbar"></nav>

  <div id="weekbar" class="weekbar hidden"></div>
  <div id="week-picker" class="week-picker hidden"></div>

  <main id="view-container"></main>

  <div id="progression-view" class="progression-view hidden"></div>
  <div id="splits-editor-view" class="progression-view hidden"></div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
